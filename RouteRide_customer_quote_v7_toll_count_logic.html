<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RouteRide — Get Your Quote</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--text:#18212b;--muted:#687482;--line:#dce2e8;--accent:#1463d6;--green:#16804b;--warn:#8a5a00}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:24px 16px 48px}.hero{margin-bottom:18px}h1{margin:0 0 6px;font-size:clamp(28px,7vw,40px)}p{line-height:1.45}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}.field{margin-bottom:15px;position:relative}label{display:block;font-weight:650;margin-bottom:7px}input,select,button{font:inherit;min-height:48px;border-radius:10px}input,select{width:100%;border:1px solid #cbd3dc;padding:10px 12px;background:#fff;color:var(--text)}button{border:1px solid #cbd3dc;padding:10px 14px;cursor:pointer}.primary{width:100%;background:var(--accent);color:white;border-color:var(--accent);font-weight:700}.suggestions{position:absolute;z-index:10;left:0;right:0;top:77px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 8px 25px #0001}.suggestions button{display:block;width:100%;border:0;border-bottom:1px solid #eef1f4;border-radius:0;text-align:left;background:#fff}.status{min-height:20px;color:var(--muted);font-size:13px;margin:8px 0}.error{color:#a12b2b}.quote{display:none;background:#f7fcf9;border-color:#bcd8ca}.quote.show{display:block}.quote-label{color:var(--muted);font-size:14px}.amount{font-size:44px;font-weight:800;margin:3px 0 10px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;color:var(--muted);font-size:14px}.summary strong{color:var(--text)}.note{font-size:13px;color:var(--muted)}.whatsapp{width:100%;background:var(--green);color:#fff;border-color:var(--green);font-weight:700;margin-top:10px}.taxnote{font-size:13px;color:var(--warn);margin:8px 0 0}.tollstatus{font-size:12px;color:var(--muted);margin-top:4px}@media(max-width:600px){.summary{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<section class="hero"><h1>Get your trip quote</h1><p class="muted">Enter your journey details to calculate your route-based quote.</p></section>
<form id="form" class="card" novalidate>
<div class="field"><label for="pickup">Pickup location</label><input id="pickup" autocomplete="off" placeholder="e.g. Mysuru" required><div id="pickupBox" class="suggestions" hidden></div></div>
<div class="field"><label for="drop">Drop location</label><input id="drop" autocomplete="off" placeholder="e.g. Kochi" required><div id="dropBox" class="suggestions" hidden></div></div>
<div class="field"><label for="date">Travel date</label><input id="date" type="date" required></div>
<div class="field"><label for="passengers">Passengers</label><select id="passengers"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option></select></div>
<div id="status" class="status" aria-live="polite"></div><button id="calculate" class="primary" type="submit">Calculate my quote</button>
</form>
<section id="quote" class="card quote" aria-live="polite"><div class="quote-label">Your trip quote</div><div id="amount" class="amount">₹0</div><div class="summary"><div>Journey: <strong id="duration">—</strong></div><div>Date: <strong id="qdate">—</strong></div><div>Passengers: <strong id="qpass">—</strong></div></div><p id="quoteNote" class="note"></p><p id="taxNote" class="taxnote"></p><button id="whatsapp" class="whatsapp" type="button">Accept &amp; Book on WhatsApp</button></section>
</main>
<script>
(() => {
const NOM='https://nominatim.openstreetmap.org/search';
const OSRM='https://router.project-osrm.org/route/v1/driving/';
const TOLL_DATA='https://raw.githubusercontent.com/ForceGT/india-toll-plazas/main/data/latest.json';
const WHATSAPP_NUMBER='918618077524';
const $=id=>document.getElementById(id); const status=$('status'); let last=null;
const d=new Date(); $('date').min=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())).toISOString().slice(0,10);
function msg(s,e=false){status.textContent=s;status.className='status'+(e?' error':'')}
function inr(n){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Math.max(0,Math.round(n)))}
function debounce(fn,ms=650){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
async function search(q){const u=new URL(NOM);u.searchParams.set('q',q);u.searchParams.set('format','jsonv2');u.searchParams.set('limit','5');u.searchParams.set('countrycodes','in');const r=await fetch(u);if(!r.ok)throw Error('Location search failed');return r.json()}
function autocomplete(input,box){const go=debounce(async()=>{const q=input.value.trim();if(q.length<3){box.hidden=true;return}try{const rs=await search(q);box.innerHTML='';rs.forEach(x=>{const b=document.createElement('button');b.type='button';b.textContent=x.display_name;b.onclick=()=>{input.value=x.display_name;input.dataset.lat=x.lat;input.dataset.lon=x.lon;input.dataset.name=x.display_name;input.dataset.state=(x.address&&x.address.state)||'';box.hidden=true};box.appendChild(b)});box.hidden=!rs.length}catch{box.hidden=true}});input.addEventListener('input',()=>{delete input.dataset.lat;delete input.dataset.lon;delete input.dataset.state;go()})}
autocomplete($('pickup'),$('pickupBox'));autocomplete($('drop'),$('dropBox'));
function point(input,label){const lat=Number(input.dataset.lat),lon=Number(input.dataset.lon);if(!Number.isFinite(lat)||!Number.isFinite(lon))throw Error(`Please select ${label} from the suggestions.`);return{lat,lon,name:input.dataset.name||input.value,state:input.dataset.state||''}}
async function route(ps){const coords=ps.map(p=>`${p.lon},${p.lat}`).join(';');const u=OSRM+coords+'?overview=full&geometries=geojson&steps=false';const r=await fetch(u);if(!r.ok)throw Error('Route service is unavailable. Please try again.');const j=await r.json();if(j.code!=='Ok'||!j.routes?.[0])throw Error('Could not find a driving route.');const rr=j.routes[0];return{km:rr.distance/1000,min:rr.duration/60,geometry:rr.geometry.coordinates}}
function fare(km){const rate=km<=250?19:16;return{rate,base:Math.round(km*rate)+500}}
function duration(min){const h=Math.floor(min/60),m=Math.round(min%60);return h?`${h} hr ${m} min`:`${m} min`}
function dateText(v){return new Date(v+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function hav(a,b){const R=6371,rad=x=>x*Math.PI/180;const dLat=rad(b[1]-a[1]),dLon=rad(b[0]-a[0]);const la1=rad(a[1]),la2=rad(b[1]);const x=Math.sin(dLat/2)**2+Math.sin(dLon/2)**2*Math.cos(la1)*Math.cos(la2);return 2*R*Math.asin(Math.sqrt(x))}
function pointSegKm(p,a,b){const lat0=p[1]*Math.PI/180;const x=(p[0]-a[0])*Math.cos(lat0),y=p[1]-a[1];const bx=(b[0]-a[0])*Math.cos(lat0),by=b[1]-a[1];const den=bx*bx+by*by;if(!den)return hav(p,a);let t=(x*bx+y*by)/den;t=Math.max(0,Math.min(1,t));return hav(p,[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}
function routeProgress(route,plaza){let best=Infinity,idx=0,along=0;for(let i=0;i<route.length-1;i++){const a=route[i],b=route[i+1],seg=hav(a,b);const dd=pointSegKm([plaza.lon,plaza.lat],a,b);if(dd<best){best=dd;idx=i;const lat0=plaza.lat*Math.PI/180;const x=(plaza.lon-a[0])*Math.cos(lat0),y=plaza.lat-a[1];const bx=(b[0]-a[0])*Math.cos(lat0),by=b[1]-a[1];const den=bx*bx+by*by;let t=den?((x*bx+y*by)/den):0;t=Math.max(0,Math.min(1,t));along=0;for(let j=0;j<i;j++)along+=hav(route[j],route[j+1]);along+=seg*t}}return{distance:best,index:idx,along}}
let tollCache=null;
async function tollData(){const key='routeride_tolls_v1';try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&saved.expires>Date.now()&&Array.isArray(saved.data))return saved.data}catch{}const r=await fetch(TOLL_DATA);if(!r.ok)throw Error('Toll data unavailable');const data=await r.json();try{localStorage.setItem(key,JSON.stringify({expires:Date.now()+24*60*60*1000,data}))}catch{}return data}
function isActive(p){return p.active===undefined||p.active===true||String(p.active).toLowerCase()==='true'}
async function findTollPlazas(route){const data=await tollData();const candidates=[];for(const p of data){if(!isActive(p))continue;const lat=Number(p.latitude),lon=Number(p.longitude);if(!Number.isFinite(lat)||!Number.isFinite(lon))continue;const hit=routeProgress(route,p);if(hit.distance<=0.25)candidates.push({name:p.tollplaza_name||p.name||p.toll_name||'Toll plaza',idx:hit.index,along:hit.along,distance:hit.distance,state:p.state_name||'',id:p.id||p.tollplaza_id||''})}
candidates.sort((a,b)=>a.along-b.along);const chosen=[];for(const x of candidates){const near=chosen.find(y=> (x.id&&y.id&&x.id===y.id) || (x.name===y.name&&Math.abs(x.along-y.along)<1.5) || Math.abs(x.along-y.along)<0.35 && x.state===y.state);if(!near)chosen.push(x)}return chosen;}
$('form').onsubmit=async e=>{e.preventDefault();$('quote').classList.remove('show');$('calculate').disabled=true;msg('Calculating your route…');try{if(!$('date').value)throw Error('Please select your travel date.');const ps=[point($('pickup'),'pickup'),point($('drop'),'drop')];const r=await route(ps),f=fare(r.km);let tollPlazas=[],tollOk=true;try{tollPlazas=await findTollPlazas(r.geometry)}catch{tollOk=false}
const interstate=/\bKarnataka\b/i.test(ps[1].state)===false && ps[1].state;const total=f.base;last={ps,r,f,tollPlazas,tollOk,date:$('date').value,passengers:$('passengers').value,interstate:!!interstate};$('amount').textContent=inr(total);$('duration').textContent=duration(r.min);$('qdate').textContent=dateText(last.date);$('qpass').textContent=last.passengers;$('quoteNote').textContent='* Interstate entry fees and toll charges are actual and will be calculated at the time of travel.';$('taxNote').textContent='';$('quote').classList.add('show');msg('Quote ready.');$('quote').scrollIntoView({behavior:'smooth'})}catch(x){msg(x.message||'Could not calculate the quote.',true)}finally{$('calculate').disabled=false}};
$('whatsapp').onclick=()=>{if(!last)return;const q=last;const p=q.ps;const tollNames=q.tollPlazas.map((x,i)=>`${i+1}. ${x.name}`).join('\n')||'No toll plaza detected on the mapped route';const text=`Hello, I would like to book a taxi.\n\nPickup: ${p[0].name}\nDrop: ${p[1].name}\nTravel date: ${dateText(q.date)}\nPassengers: ${q.passengers}\nRoute distance: ${q.r.km.toFixed(1)} km\nToll gates / plazas detected on route: ${q.tollPlazas.length}\n${tollNames}\n\nQuoted amount shown to customer: ${inr(q.f.base)}\nInterstate entry fees/tolls: Extra — actual charges to be calculated at the time of travel.\n\nPlease confirm availability and final booking amount.`;window.open('https://wa.me/'+WHATSAPP_NUMBER+'?text='+encodeURIComponent(text),'_blank','noopener')};
})();
</script></body></html>
